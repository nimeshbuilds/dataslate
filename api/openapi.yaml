  "components": {
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "JWT",
        "description": "Signed access token for the configured API audience. Required claims: sub, exp, iss, aud; dataslate_workspaces maps IDs to viewer/editor/admin and dataslate_roles may include platform-admin."
      }
    },
    "schemas": {
      "Error": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "error": {
            "type": "object",
            "additionalProperties": false,
            "properties": {
              "code": {
                "type": "string"
              },
              "message": {
                "type": "string"
              }
            },
            "required": [
              "code",
              "message"
            ]
          }
        },
        "required": [
          "error"
        ]
      },
      "AuthConfig": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "mode": {
            "enum": [
              "oidc",
              "development"
            ]
          },
          "issuer": {
            "type": "string"
          },
          "audience": {
            "type": "string"
          },
          "clientId": {
            "type": "string"
          },
          "scopes": {
            "type": "array",
            "items": {
              "type": "string"
            }
          }
        },
        "required": [
          "mode"
        ]
      },
      "Status": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "product": {
            "const": "DataSlate"
          },
          "assistant": {
