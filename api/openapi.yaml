        "properties": {
          "text": {
            "type": "string"
          },
          "truncated": {
            "type": "boolean"
          }
        },
        "required": [
          "text",
          "truncated"
        ]
      },
      "NotebookSelection": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "pattern": "^[a-z0-9][a-z0-9-]{0,62}$"
          },
          "revision": {
            "type": "integer",
            "minimum": 1
          }
        },
        "required": [
          "id",
          "revision"
        ]
      },
      "NotebookProvenance": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "pattern": "^[a-z0-9][a-z0-9-]{0,62}$"
          },
          "revision": {
            "type": "integer",
            "minimum": 1
          },
          "sha256": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$"
          },
          "cellIds": {
            "type": "array",
            "items": {
              "type": "string",
              "pattern": "^[a-z0-9][a-z0-9-]{0,62}$"
            },
            "minItems": 1,
            "maxItems": 200
          },
          "bytes": {
            "type": "integer",
            "minimum": 1,
            "maximum": 262144
          }
        },
        "required": [
          "id",
          "revision",
          "sha256",
          "cellIds",
          "bytes"
        ]
      },
      "SourceArtifact": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "name": {
            "type": "string",
            "pattern": "^ds-[a-f0-9]{32}-source$"
          },
          "uid": {
            "type": "string",
            "minLength": 1,
            "maxLength": 256
          },
          "state": {
            "enum": [
              "pending",
              "ready",
              "cleanup_pending",
              "deleted"
            ]
          },
          "creationStarted": {
            "type": "boolean"
          }
        },
        "required": [
          "name",
          "state",
          "creationStarted"
        ],
        "description": "Source lifecycle is separate from execution. Terminal runs may retain cleanup_pending when resource identity or deletion is unconfirmed."
      },
      "RunSource": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "source": {
            "type": "string",
            "description": "Exact generated UTF-8 Python snapshot, at most 256 KiB before JSON encoding."
          },
          "notebook": {
            "$ref": "#/components/schemas/NotebookProvenance"
          }
        },
        "required": [
          "source",
          "notebook"
        ]
      }
    }
  }
}
