name: Foundation checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17@sha256:7d0a41464797aeb9862dfdc0bbf1526b82cfd324cdd8036df19e3545f4a9ccb8
        env:
          POSTGRES_DB: dataslate_test
          POSTGRES_USER: dataslate
          POSTGRES_PASSWORD: dataslate-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dataslate -d dataslate_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: Install the explicitly selected vector extension
        run: psql "$DATASLATE_TEST_DATABASE_URL" -f deploy/search/enable-vector.sql
        env:
          DATASLATE_TEST_DATABASE_URL: postgres://dataslate:dataslate-ci-only@127.0.0.1:5432/dataslate_test?sslmode=disable
      - name: API tests and vet
        run: make test-api
        env:
          # Ephemeral CI database only; production requires verified TLS.
          DATASLATE_TEST_DATABASE_URL: postgres://dataslate:dataslate-ci-only@127.0.0.1:5432/dataslate_test?sslmode=disable
          DATASLATE_TEST_REQUIRE_VECTOR: "1"
      - name: API image build
        run: docker build -t dataslate-api:ci api
      - name: PostgreSQL installation guard exit codes
        run: python3 -m unittest discover -s deploy/setup -p 'test_runtime_role_postgres.py' -v
        env:
          # Explicit disposable CI fixture; this check creates no roles or schemas.
          DATASLATE_TEST_DATABASE_URL: postgres://dataslate:dataslate-ci-only@127.0.0.1:5432/dataslate_test?sslmode=disable
      - name: Test and compile the opt-in PostgreSQL memory browser harness
        run: |
          mkdir -p api/.qa/memory-workspace
          cp scripts/qualify-memory-workspace.go api/.qa/memory-workspace/main.go
          cp scripts/qualify-memory-workspace_test.go api/.qa/memory-workspace/main_test.go
          cd api
          go test -race ./.qa/memory-workspace
          go build -o "$RUNNER_TEMP/dataslate-memory-workspace" ./.qa/memory-workspace
      - name: SQL controller image build
        run: docker build -f api/SQLControllerDockerfile -t dataslate-sql-controller:ci api
      - name: Publication controller image build
        run: docker build -f api/PublicationControllerDockerfile -t dataslate-publication-controller:ci api
      - name: Workflow controller image build
        run: docker build -f api/WorkflowControllerDockerfile -t dataslate-workflow-controller:ci api
      - name: Search controller image build
        run: docker build -f api/SearchControllerDockerfile -t dataslate-search-controller:ci api
      - name: Sylon controller image build
        run: docker build -f api/SylonControllerDockerfile -t dataslate-sylon-controller:ci api
      - name: Execution controller image build
        run: docker build -f api/ControllerDockerfile -t dataslate-controller:ci api

  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: {python-version: "3.12"}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - run: make test-sdk
      - name: Ingestion runtime contract tests
        run: python -m unittest discover -s runtime/ingestion/tests -p 'test_*.py' -v
      - run: python -m pip install ./sdk/python
      - run: dataslate --help
      - name: Real API and SDK smoke
        run: bash scripts/smoke.sh

  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: GitHub Pages quickstart browser checks
        run: node site/check-browser.mjs
      - run: npm test
        working-directory: web
      - name: Workspace image build
        run: docker build -t dataslate-web:ci web

  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: {python-version: "3.12"}
      - run: python -m pip install -r deploy/tests/requirements.txt
      - name: Verify immutable application base images
        run: python deploy/scripts/check-base-images.py
      - name: Install verified local Helm binary
        run: python deploy/scripts/fetch-helm.py
      - name: Fetch verified upstream bootstrap charts
        run: python deploy/scripts/fetch-upstream.py
      - name: Fetch pinned SQL chart
        run: python deploy/sql/fetch.py
      - name: Fetch pinned Polaris chart
        run: python deploy/polaris/fetch.py
      - name: Fetch pinned optional Airflow chart
        run: python deploy/airflow/fetch.py
      - name: Validate governed SQL profile
        run: python -m unittest discover -s deploy/sql -p 'test_*.py' -v
        env:
          HELM_BIN: deploy/.cache/helm
      - name: Validate Polaris profile
        run: python -m unittest discover -s deploy/polaris -p 'test_*.py' -v
        env:
          HELM_BIN: deploy/.cache/helm
      - name: Validate optional managed Airflow profile
        run: python -m unittest discover -s deploy/airflow -p 'test_*.py' -v
        env:
          HELM_BIN: deploy/.cache/helm
      - name: Validate production setup bundle
        run: python -m unittest discover -s deploy/setup -p 'test_*.py' -v
        env:
          HELM_BIN: deploy/.cache/helm
      - name: Verify HTTPS installation checker
        run: python -m unittest discover -s deploy/tests -p 'test_*.py' -v
      - name: Validate compute boundary generator
        run: python -m unittest discover -s deploy/compute -p 'test_*.py' -v
      - name: Validate deployment profiles
        run: bash deploy/scripts/check.sh
        env:
          HELM_BIN: deploy/.cache/helm
      - name: Validate read-only installation preflight
        run: python -m unittest discover -s deploy/preflight -p 'test_*.py' -v
        env:
          DATASLATE_PREFLIGHT_HELM: deploy/.cache/helm

  airflow-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: {python-version: "3.12"}
      - name: Verify reviewed Airflow dependency constraints
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          root = Path('integrations/airflow')
          lock = json.loads((root / 'constraints.lock.json').read_text())
          assert hashlib.sha256((root / 'constraints-3.12.txt').read_bytes()).hexdigest() == lock['sha256']
          PY
      - name: Install pinned Airflow and local provider
        run: python -m pip install -c integrations/airflow/constraints-3.12.txt ./sdk/python ./integrations/airflow
      - name: Provider, TLS authentication, XCom and example DAG checks
        run: python -m unittest discover -s integrations/airflow/tests -p 'test_*.py' -v
        env:
          AIRFLOW_HOME: ${{ runner.temp }}/dataslate-airflow-tests
          PYTHONPATH: sdk/python/src:integrations/airflow/src
      - name: Prepare allowlisted Airflow image context
        run: python deploy/airflow/build_context.py --output "$RUNNER_TEMP/dataslate-airflow-context"
      - name: Build the pinned optional Airflow runtime
        run: docker build -f "$RUNNER_TEMP/dataslate-airflow-context/deploy/airflow/Dockerfile" -t dataslate-airflow:ci "$RUNNER_TEMP/dataslate-airflow-context"
      - name: Verify installed providers in the actual isolated image
        run: docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges --entrypoint python dataslate-airflow:ci /opt/dataslate-profile/runtime_check.py --imports-only

  ingestion-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - name: Build the pinned Spark and Delta runtime
        run: docker build -t dataslate-ingestion:qualification runtime/ingestion
      - name: Build the offline qualification harness
        run: docker build -f runtime/ingestion/QualificationDockerfile -t dataslate-ingestion-tests:qualification runtime/ingestion
      - name: Real JVM ingestion qualification
        run: docker run --rm --network none --memory 4g --cpus 2 dataslate-ingestion-tests:qualification
