apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dataslate.fullname" . }}-web
  labels:
    {{- include "dataslate.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "dataslate.selector" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "dataslate.selector" . | nindent 8 }}
        app.kubernetes.io/component: web
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "dataslate.fullname" . }}-web
      automountServiceAccountToken: false
      securityContext:
        {{- include "dataslate.podSecurityContext" . | nindent 8 }}
      terminationGracePeriodSeconds: 30
      {{- include "dataslate.scheduling" . | nindent 6 }}
      containers:
        - name: web
          image: {{ include "dataslate.image" .Values.web.image | quote }}
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          securityContext:
            {{- include "dataslate.containerSecurityContext" . | nindent 12 }}
          ports:
            - {name: http, containerPort: 8080, protocol: TCP}
          env:
            - name: DATASLATE_API_UPSTREAM
              value: {{ printf "http://%s-api:8080" (include "dataslate.fullname" .) | quote }}
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          startupProbe:
            httpGet: {path: /web-healthz, port: http}
            failureThreshold: 15
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /web-healthz, port: http}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /web-healthz, port: http}
            periodSeconds: 5
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dataslate.fullname" . }}-web
  labels:
    {{- include "dataslate.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "dataslate.selector" . | nindent 4 }}
    app.kubernetes.io/component: web
  ports:
    - {name: http, port: 8080, targetPort: http, protocol: TCP}
