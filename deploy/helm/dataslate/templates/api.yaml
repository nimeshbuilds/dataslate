apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dataslate.fullname" . }}-api
  labels:
    {{- include "dataslate.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "dataslate.selector" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "dataslate.selector" . | nindent 8 }}
        app.kubernetes.io/component: api
        dataslate.io/tier: backend
      annotations:
        checksum/oidc: {{ .Values.oidc | toJson | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "dataslate.fullname" . }}-api
      automountServiceAccountToken: false
      securityContext:
        {{- include "dataslate.podSecurityContext" . | nindent 8 }}
      terminationGracePeriodSeconds: 30
      {{- include "dataslate.scheduling" . | nindent 6 }}
      containers:
        - name: api
          image: {{ include "dataslate.image" .Values.api.image | quote }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          args: [serve]
          securityContext:
            {{- include "dataslate.containerSecurityContext" . | nindent 12 }}
          ports:
            - {name: http, containerPort: 8080, protocol: TCP}
          env:
            - {name: DATASLATE_ADDR, value: "0.0.0.0:8080"}
            - {name: DATASLATE_AUTH_MODE, value: oidc}
            - {name: DATASLATE_OIDC_ISSUER, value: {{ .Values.oidc.issuer | quote }}}
            - {name: DATASLATE_OIDC_AUDIENCE, value: {{ .Values.oidc.audience | quote }}}
            - {name: DATASLATE_OIDC_CLIENT_ID, value: {{ .Values.oidc.clientId | quote }}}
            - {name: DATASLATE_OIDC_SCOPES, value: {{ .Values.oidc.scopes | quote }}}
            {{- include "dataslate.databaseEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - {name: postgres-ca, mountPath: /etc/dataslate/postgres, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        {{- include "dataslate.databaseVolume" . | nindent 8 }}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dataslate.fullname" . }}-api
  labels:
    {{- include "dataslate.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "dataslate.selector" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - {name: http, port: 8080, targetPort: http, protocol: TCP}
