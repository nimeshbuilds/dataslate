apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dataslate.fullname" . }}-api
  labels:
    {{- include "dataslate.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "dataslate.selector" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "dataslate.selector" . | nindent 8 }}
        app.kubernetes.io/component: api
        dataslate.io/tier: backend
      annotations:
        checksum/execution: {{ .Values.execution | toJson | sha256sum }}
        checksum/workflow: {{ .Values.workflow | toJson | sha256sum }}
        checksum/publication: {{ .Values.publication | toJson | sha256sum }}
        checksum/sql: {{ .Values.sql | toJson | sha256sum }}
        checksum/sylon: {{ .Values.sylon | toJson | sha256sum }}
        checksum/search: {{ .Values.search | toJson | sha256sum }}
        checksum/catalog: {{ .Values.catalog | toJson | sha256sum }}
        checksum/oidc: {{ .Values.oidc | toJson | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "dataslate.fullname" . }}-api
      automountServiceAccountToken: {{ .Values.execution.enabled }}
      securityContext:
        {{- include "dataslate.podSecurityContext" . | nindent 8 }}
        {{- if or .Values.catalog.enabled .Values.search.enabled .Values.workflow.enabled }}
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        {{- end }}
      terminationGracePeriodSeconds: 30
      {{- include "dataslate.scheduling" . | nindent 6 }}
      containers:
        - name: api
          image: {{ include "dataslate.image" .Values.api.image | quote }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          args: [serve]
          securityContext:
            {{- include "dataslate.containerSecurityContext" . | nindent 12 }}
          ports:
            - {name: http, containerPort: 8080, protocol: TCP}
          env:
            - {name: DATASLATE_ADDR, value: "0.0.0.0:8080"}
            - {name: DATASLATE_AUTH_MODE, value: oidc}
            - {name: DATASLATE_OIDC_ISSUER, value: {{ .Values.oidc.issuer | quote }}}
            - {name: DATASLATE_OIDC_AUDIENCE, value: {{ .Values.oidc.audience | quote }}}
            - {name: DATASLATE_OIDC_CLIENT_ID, value: {{ .Values.oidc.clientId | quote }}}
            - {name: DATASLATE_OIDC_SCOPES, value: {{ .Values.oidc.scopes | quote }}}
            {{- include "dataslate.databaseEnv" . | nindent 12 }}
            {{- if .Values.catalog.enabled }}
            - {name: DATASLATE_CATALOG_BINDINGS_FILE, value: /etc/dataslate/catalog/bindings.json}
            {{- end }}
            {{- if .Values.sylon.enabled }}
            - {name: DATASLATE_SYLON_BINDINGS_FILE, value: /etc/dataslate/sylon/bindings.json}
            {{- end }}
            {{- if .Values.search.enabled }}
            - {name: DATASLATE_SEARCH_BINDINGS_FILE, value: /etc/dataslate/search/bindings.json}
            {{- end }}
            {{- if .Values.workflow.enabled }}
            - {name: DATASLATE_WORKFLOW_BINDINGS_FILE, value: /etc/dataslate/workflow/bindings.json}
            {{- end }}
            {{- if .Values.publication.enabled }}
            - {name: DATASLATE_PUBLICATION_BINDINGS_FILE, value: /etc/dataslate/publication/bindings.json}
            {{- end }}
            {{- if .Values.sql.enabled }}
            - {name: DATASLATE_SQL_BINDINGS_FILE, value: /etc/dataslate/sql/bindings.json}
            {{- end }}
            {{- if .Values.execution.enabled }}
            - {name: DATASLATE_EXECUTION_BINDINGS_FILE, value: /etc/dataslate/execution/bindings.json}
            - {name: DATASLATE_EXECUTION_NAMESPACES, value: {{ include "dataslate.executionNamespaces" . | quote }}}
            {{- end }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - {name: postgres-ca, mountPath: /etc/dataslate/postgres, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            {{- if .Values.workflow.enabled }}
            - {name: workflow, mountPath: /etc/dataslate/workflow, readOnly: true}
            {{- include "dataslate.workflowCredentialMounts" .Values.workflow.credentials | nindent 12 }}
            {{- end }}
            {{- if .Values.catalog.enabled }}
            - {name: catalog, mountPath: /etc/dataslate/catalog, readOnly: true}
            {{- range .Values.catalog.credentials }}
            - name: catalog-credential-{{ .id }}
              mountPath: {{ printf "/etc/dataslate/catalog-credentials/%s" .id | quote }}
              readOnly: true
            {{- end }}
            {{- end }}
            {{- if .Values.sylon.enabled }}
            - {name: sylon, mountPath: /etc/dataslate/sylon, readOnly: true}
            {{- end }}
            {{- if .Values.search.enabled }}
            - {name: search, mountPath: /etc/dataslate/search, readOnly: true}
            {{- include "dataslate.searchCredentialMounts" .Values.search.credentials | nindent 12 }}
            {{- end }}
            {{- if .Values.publication.enabled }}
            - {name: publication, mountPath: /etc/dataslate/publication, readOnly: true}
            {{- end }}
            {{- if .Values.sql.enabled }}
            - {name: sql, mountPath: /etc/dataslate/sql, readOnly: true}
            {{- end }}
            {{- if .Values.execution.enabled }}
            - {name: execution, mountPath: /etc/dataslate/execution, readOnly: true}
            {{- end }}
      volumes:
        {{- if .Values.workflow.enabled }}
        - name: workflow
          configMap:
            name: {{ include "dataslate.fullname" . }}-workflow
        {{- include "dataslate.workflowCredentialVolumes" (dict "credentials" .Values.workflow.credentials "mode" "read") | nindent 8 }}
        {{- end }}
        {{- if .Values.publication.enabled }}
        - name: publication
          configMap:
            name: {{ include "dataslate.fullname" . }}-publication
        {{- end }}
        {{- if .Values.sylon.enabled }}
        - name: sylon
          configMap:
            name: {{ include "dataslate.fullname" . }}-sylon
        {{- end }}
        {{- if .Values.search.enabled }}
        - name: search
          configMap:
            name: {{ include "dataslate.fullname" . }}-search
        {{- include "dataslate.searchCredentialVolumes" .Values.search.credentials | nindent 8 }}
        {{- end }}
        {{- if .Values.catalog.enabled }}
        - name: catalog
          configMap:
            name: {{ include "dataslate.fullname" . }}-catalog
        {{- range .Values.catalog.credentials }}
        - name: catalog-credential-{{ .id }}
          projected:
            defaultMode: 0440
            sources:
              {{- if .bearerTokenSecret }}
              - secret:
                  name: {{ .bearerTokenSecret.name | quote }}
                  items:
                    - {key: {{ .bearerTokenSecret.key | quote }}, path: token}
              {{- else }}
              - secret:
                  name: {{ .oauth.clientSecret.name | quote }}
                  items:
                    - {key: {{ .oauth.clientSecret.key | quote }}, path: client-secret}
              {{- end }}
              {{- if .caSecret }}
              - secret:
                  name: {{ .caSecret.name | quote }}
                  items:
                    - {key: {{ .caSecret.key | quote }}, path: ca.crt}
              {{- end }}
        {{- end }}
        {{- end }}
        {{- if .Values.sql.enabled }}
        - name: sql
          configMap:
            name: {{ include "dataslate.fullname" . }}-sql
        {{- end }}
        {{- if .Values.execution.enabled }}
        - name: execution
          configMap:
            name: {{ include "dataslate.fullname" . }}-execution
        {{- end }}
        {{- include "dataslate.databaseVolume" . | nindent 8 }}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dataslate.fullname" . }}-api
  labels:
    {{- include "dataslate.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "dataslate.selector" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - {name: http, port: 8080, targetPort: http, protocol: TCP}
