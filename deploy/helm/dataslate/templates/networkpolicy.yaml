{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dataslate.fullname" . }}-backend
  labels:
    {{- include "dataslate.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "dataslate.selector" . | nindent 6 }}
      dataslate.io/tier: backend
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "dataslate.selector" . | nindent 14 }}
              app.kubernetes.io/component: web
      ports: [{protocol: TCP, port: 8080}]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.dnsNamespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.dnsPodLabels | nindent 14 }}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    {{- if .Values.networkPolicy.httpsEgressCidrs }}
    - to:
        {{- range .Values.networkPolicy.httpsEgressCidrs }}
        - ipBlock: {cidr: {{ . | quote }}}
        {{- end }}
      ports:
        {{- range .Values.networkPolicy.httpsEgressPorts }}
        - {protocol: TCP, port: {{ . }}}
        {{- end }}
    {{- end }}
    - to:
        {{- if eq .Values.postgres.mode "managed" }}
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ include "dataslate.postgresName" . }}
        {{- else }}
        {{- range .Values.networkPolicy.postgresEgressCidrs }}
        - ipBlock: {cidr: {{ . | quote }}}
        {{- end }}
        {{- end }}
      ports: [{protocol: TCP, port: {{ .Values.networkPolicy.postgresPort }}}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dataslate.fullname" . }}-web
  labels:
    {{- include "dataslate.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "dataslate.selector" . | nindent 6 }}
      app.kubernetes.io/component: web
  policyTypes: [Ingress, Egress]
  ingress:
    {{- if .Values.networkPolicy.webIngressFrom }}
    - from:
        {{- toYaml .Values.networkPolicy.webIngressFrom | nindent 8 }}
      ports: [{protocol: TCP, port: 8080}]
    {{- else }}
    []
    {{- end }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "dataslate.selector" . | nindent 14 }}
              app.kubernetes.io/component: api
      ports: [{protocol: TCP, port: 8080}]
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.dnsNamespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.dnsPodLabels | nindent 14 }}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
{{- end }}
