{{- if .Values.catalog.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dataslate.fullname" . }}-catalog
  labels:
    {{- include "dataslate.labels" . | nindent 4 }}
data:
  bindings.json: {{ include "dataslate.catalogBindings" . | quote }}
{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dataslate.fullname" . }}-catalog
  labels:
    {{- include "dataslate.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "dataslate.selector" . | nindent 6 }}
      app.kubernetes.io/component: api
  policyTypes: [Egress]
  egress:
    {{- range .Values.catalog.egress }}
    - to:
        - ipBlock: {cidr: {{ .cidr | quote }}}
      ports: [{protocol: TCP, port: {{ .port }}}]
    {{- end }}
{{- end }}
{{- end }}
