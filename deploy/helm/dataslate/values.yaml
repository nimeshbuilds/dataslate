# Empty identity/database fields deliberately prevent an unconfigured installation.
nameOverride: ""
fullnameOverride: ""
imagePullSecrets: []
oidc:
  issuer: ""
  audience: dataslate-api
  clientId: dataslate-web
  scopes: openid profile
api:
  replicas: 2
  image:
    repository: dataslate-api
    tag: 0.1.0-foundation
    digest: ""
    pullPolicy: IfNotPresent
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}
web:
  replicas: 2
  image:
    repository: dataslate-web
    tag: 0.1.0-foundation
    digest: ""
    pullPolicy: IfNotPresent
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}
serviceAccount:
  annotations: {}
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
postgres:
  mode: external
  external:
    secretName: ""
    secretKey: database-url
    caSecretName: ""
    caSecretKey: ca.crt
  managed:
    # Explicit acknowledgment: the administrator owns a compatible existing operator.
    operatorAccepted: false
    name: ""
    instances: 3
    imageName: ghcr.io/cloudnative-pg/postgresql:17.10@sha256:eb298ae82db3e3f849db57a44bfe6fed4c4a3c95451655611980340409e5c2ec
    storageClass: ""
    storageSize: 50Gi
    resources:
      requests: {cpu: 500m, memory: 1Gi}
      limits: {cpu: "2", memory: 2Gi}
    # Keeps the Cluster/PVC ownership separate from uninstalling the workspace.
    retainOnUninstall: true
migrations:
  enabled: true
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""
  tls:
    secretName: ""
    # Used only when the ingress controller terminates TLS outside the cluster (e.g. ACM).
    externallyTerminated: false
podDisruptionBudget:
  enabled: true
  minAvailable: 1
networkPolicy:
  enabled: true
  # Empty means deny remote web ingress. Set your actual ingress-controller peers.
  webIngressFrom: []
  dnsNamespace: kube-system
  dnsPodLabels: {k8s-app: kube-dns}
  # OIDC discovery/JWKS. Restrict to your gateway/IdP CIDRs where stable.
  httpsEgressCidrs: [0.0.0.0/0]
  # Include the HTTPS ports used by your issuer's discovery and JWKS endpoints.
  httpsEgressPorts: [443]
  # Required for external PostgreSQL; use database subnets, never the whole Internet.
  postgresEgressCidrs: []
  # Must match the port in the external database URL Secret; managed CNPG uses 5432.
  postgresPort: 5432

# Execution is opt-in. This does not adopt or install an operator or compute namespace.
execution:
  enabled: false
  operatorAccepted: false
  runtimePolicyAccepted: false
  # Keep namespaces until their runs are drained; removing a binding must not revoke cancellation RBAC.
  namespaces: []
  bindings: []
  kubernetesEgressCidrs: []
  kubernetesPort: 443
  controller:
    replicas: 2
    image:
      repository: dataslate-controller
      tag: 0.1.0-foundation
      digest: ""
      pullPolicy: IfNotPresent
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: "1", memory: 512Mi}

# SQL is a separate opt-in controller. The existing Trino service remains externally owned.
sql:
  enabled: false
  # Bindings reference a credentials ID. Secret values never belong in these values.
  bindings: []
  # Keep credentials and egress until every accepted query has drained, even after grants are removed.
  credentials: []
  # Exact engine destination CIDR/port pairs, separate from API OIDC egress.
  engineEgress: []
  controller:
    replicas: 2
    image:
      repository: dataslate-sql-controller
      tag: 0.1.0-foundation
      digest: ""
      pullPolicy: IfNotPresent
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: "1", memory: 512Mi}

# Metadata-only Polaris adapter; provider credentials are mounted in the API.
catalog:
  enabled: false
  bindings: []
  credentials: []
  # Exact coordinator and OAuth token endpoint destinations, when applicable.
  egress: []

# Workspace discovery. Lexical mode needs only PostgreSQL; hybrid uses approved HTTPS embeddings.
search:
  enabled: false
  bindings: []
  credentials: []
  # Exact embedding gateway/OAuth destinations for API queries and worker indexing.
  embeddingEgress: []
  # Exact Polaris/OAuth destinations needed by the worker's selected catalog sources.
  catalogEgress: []
  controller:
    replicas: 2
    image:
      repository: dataslate-search-controller
      tag: 0.1.0-foundation
      digest: ""
      pullPolicy: IfNotPresent
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: "1", memory: 512Mi}

# Private bounded assistant conversations; provider credentials stay in the worker.
sylon:
  # A binding may opt in to private memory with:
  # memory: {enabled: true, defaultTTLDays: 30, maxTTLDays: 365}
  # Omitting memory preserves the binding configuration and disables memory.
  enabled: false
  bindings: []
  credentials: []
  # Exact provider and OAuth destination CIDR/ports for the worker only.
  providerEgress: []
  # Context retrieval destinations: selected embedding gateways/OAuth and Polaris/OAuth.
  searchEgress: []
  catalogEgress: []
  controller:
    replicas: 2
    image:
      repository: dataslate-sylon-controller
      tag: 0.1.0-foundation
      digest: ""
      pullPolicy: IfNotPresent
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: "1", memory: 512Mi}
